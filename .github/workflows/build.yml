# Builds mavrik's Wine engine from the pinned inputs in inputs.json, runs the gates that fail
# the build, proves each gate fails on a bad input, and uploads the engine as an artifact.
# Started by hand only. A prerelease is published only when publish_release is set.
#
# The steps themselves live in scripts/ (build.sh, assemble.sh, gates.sh, pack.sh), so a build on a
# Mac runs exactly what this workflow runs. This file only prepares the runner and keeps the caches.
name: build

on:
  workflow_dispatch:
    inputs:
      publish_release:
        description: "Publish a prerelease with the engine and its sources (every gate must pass first)"
        type: boolean
        default: false
      fresh:
        description: "Ignore the build caches: a clean build from the pinned inputs"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

env:
  HOMEBREW_NO_AUTO_UPDATE: "1"
  HOMEBREW_NO_INSTALL_CLEANUP: "1"
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: "1"
  HOMEBREW_NO_ANALYTICS: "1"
  WORK: ${{ github.workspace }}/work

jobs:
  build:
    # Intel on purpose: the tree's Unix side is x86_64 only (its Metal layer class sits behind
    # #if defined(__x86_64__)), as in CrossOver's own builds. It runs under Rosetta on Apple silicon.
    runs-on: macos-15-intel
    timeout-minutes: 350
    outputs:
      name: ${{ steps.pack.outputs.name }}
    steps:
      - uses: actions/checkout@v4

      - name: Release builds need every input pinned
        if: ${{ inputs.publish_release }}
        run: python3 scripts/fetch.py check-pins inputs.json

      - name: Cache keys
        id: keys
        run: python3 scripts/buildinfo.py keys inputs.json | tee -a "$GITHUB_OUTPUT"

      # Each cache holds a folder build.sh stamps with the same key, so build.sh skips what a cache restored.
      - name: Restore downloads
        id: dl-cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: work/downloads
          key: ${{ steps.keys.outputs.downloads }}

      - name: Restore our Unix libraries
        id: deps-cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: work/deps
          key: ${{ steps.keys.outputs.deps }}

      - name: Restore the Wine build
        id: wine-cache
        if: ${{ !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: work/wine-install
          key: ${{ steps.keys.outputs.wine }}

      - name: Restore the compiler cache
        if: ${{ steps.wine-cache.outputs.cache-hit != 'true' && !inputs.fresh }}
        uses: actions/cache/restore@v4
        with:
          path: work/ccache
          key: ccache-${{ github.run_id }}
          restore-keys: ccache-

      - name: Toolchain (bison 3 and mingw-w64 gcc; the rest is on the runner or pinned)
        run: brew install -q bison mingw-w64

      - name: Build (inputs, toolchain, sources and patches, Unix libraries, Wine)
        run: bash scripts/build.sh "$WORK" ${{ inputs.publish_release && '--release' || '' }}

      - name: Save downloads
        if: ${{ always() && steps.dl-cache.outputs.cache-hit != 'true' && hashFiles('work/downloads/.stamp') != '' }}
        uses: actions/cache/save@v4
        with:
          path: work/downloads
          key: ${{ steps.keys.outputs.downloads }}

      - name: Save our Unix libraries
        if: ${{ always() && steps.deps-cache.outputs.cache-hit != 'true' && hashFiles('work/deps/.stamp') != '' }}
        uses: actions/cache/save@v4
        with:
          path: work/deps
          key: ${{ steps.keys.outputs.deps }}

      - name: Save the compiler cache
        if: ${{ always() && steps.wine-cache.outputs.cache-hit != 'true' && hashFiles('work/ccache/**') != '' }}
        uses: actions/cache/save@v4
        with:
          path: work/ccache
          key: ccache-${{ github.run_id }}

      - name: Save the Wine build
        if: ${{ always() && steps.wine-cache.outputs.cache-hit != 'true' && hashFiles('work/wine-install/.stamp') != '' }}
        uses: actions/cache/save@v4
        with:
          path: work/wine-install
          key: ${{ steps.keys.outputs.wine }}

      - name: Assemble the engine
        run: bash scripts/assemble.sh "$WORK"

      - name: Gates, then the gate self-test (each gate must fail on a bad input)
        run: bash scripts/gates.sh "$WORK"

      - name: Pack
        id: pack
        run: bash scripts/pack.sh "$WORK"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pack.outputs.name }}
          path: |
            work/out/*.tar.xz
            work/out/*.tar.xz.sha256
            work/out/*.json
          retention-days: 30
          compression-level: 0

      - name: Collect the corresponding sources for a release
        if: ${{ inputs.publish_release }}
        run: python3 scripts/release.py collect inputs.json "$WORK" "$WORK/release-sources"

      - uses: actions/upload-artifact@v4
        if: ${{ inputs.publish_release }}
        with:
          name: sources
          path: work/release-sources
          retention-days: 30
          compression-level: 0

  release:
    needs: build
    if: ${{ inputs.publish_release }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Publish the prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          name="${{ needs.build.outputs.name }}"
          tag="${name#mavrik-engine-}-$(date -u +%Y%m%d)-run${{ github.run_id }}"
          files=$(find dist -type f | sort)
          gh release create "$tag" $files --prerelease --title "$name ($tag)" \
            --notes-file <(python3 scripts/release.py notes inputs.json "$name" "${{ github.run_id }}")
